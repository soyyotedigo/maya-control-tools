name: Test Suite

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PySide6

      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests \
            --ignore=tests/maya \
            --ignore=tests/test_views_ui.py \
            -q

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PySide6

      - name: Run UI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/test_views_ui.py -q

  maya-integration:
    name: Maya ${{ matrix.maya_version }}
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        maya_version: ["2022", "2023", "2024", "2025", "2026"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull Maya Docker image
        id: image
        shell: bash
        run: |
          if docker pull mottosso/maya:${{ matrix.maya_version }}; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Maya ${{ matrix.maya_version }}"
              echo "- Status: skipped"
              echo "- Reason: Docker image mottosso/maya:${{ matrix.maya_version }} is not available"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run Maya integration tests
        if: steps.image.outputs.available == 'true'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e QT_QPA_PLATFORM=offscreen \
            mottosso/maya:${{ matrix.maya_version }} \
            bash -lc "python3 -m pip install --target /tmp/pytest-deps 'pytest<9' && PYTHONPATH=/tmp/pytest-deps mayapy -m pytest tests/maya -v --tb=short" \
            | tee maya-${{ matrix.maya_version }}.log

      - name: Upload Maya test log
        if: steps.image.outputs.available == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: maya-${{ matrix.maya_version }}-log
          path: maya-${{ matrix.maya_version }}.log
